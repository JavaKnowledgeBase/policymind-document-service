env_file:
  - .env
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: ${APP_MAX_FILE_SIZE:50MB}
      max-request-size: ${APP_MAX_REQUEST_SIZE:50MB}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
  redis:
    host: localhost
    port: 6379
  security:
    oauth2:
      client:
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/userinfo
            user-name-attribute: sub
          twitter:
            authorization-uri: https://twitter.com/i/oauth2/authorize
            token-uri: https://api.twitter.com/2/oauth2/token
            user-info-uri: https://api.twitter.com/2/users/me?user.fields=id,name,username
            user-name-attribute: id
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled-google-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "${APP_OAUTH2_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
          microsoft:
            provider: microsoft
            client-id: ${MICROSOFT_CLIENT_ID:disabled-microsoft-client-id}
            client-secret: ${MICROSOFT_CLIENT_SECRET:disabled-microsoft-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "${APP_OAUTH2_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:disabled-facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:disabled-facebook-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "${APP_OAUTH2_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope: public_profile, email
          linkedin:
            provider: linkedin
            client-id: ${LINKEDIN_CLIENT_ID:disabled-linkedin-client-id}
            client-secret: ${LINKEDIN_CLIENT_SECRET:disabled-linkedin-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "${APP_OAUTH2_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
            client-name: LinkedIn
          twitter:
            provider: twitter
            client-id: ${TWITTER_CLIENT_ID:disabled-twitter-client-id}
            client-secret: ${TWITTER_CLIENT_SECRET:disabled-twitter-client-secret}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "${APP_OAUTH2_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope: tweet.read, users.read, offline.access

server:
  port: 8080

logging:
  file:
    name: logs/policymind-document-service.log

openai:
  api-key: ${OPENAI_API_KEY}
  chat-model: ${OPENAI_CHAT_MODEL:gpt-5.4-mini}

ai:
  provider:
    embedding: ${AI_EMBEDDING_PROVIDER:openai}

gcp:
  project-id: ${GCP_PROJECT_ID:}
  location: ${GCP_LOCATION:us-central1}
  bearer-token: ${GCP_BEARER_TOKEN:}
  vertex:
    embedding-model: ${GCP_VERTEX_EMBEDDING_MODEL:text-embedding-005}
    chat-model: ${GCP_VERTEX_CHAT_MODEL:gemini-3.1-flash-lite}

app:
  oauth2:
    redirect-uri: ${FRONTEND_OAUTH_CALLBACK_URL:http://localhost:5173/auth/callback}
  recaptcha:
    enabled: ${APP_RECAPTCHA_ENABLED:false}
    site-key: ${APP_RECAPTCHA_SITE_KEY:}
    secret-key: ${APP_RECAPTCHA_SECRET_KEY:}
    min-score: ${APP_RECAPTCHA_MIN_SCORE:0.2}
    verify-url: ${APP_RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
  header-content:
    csv-path: ${HEADER_CONTENT_CSV_PATH:resource_docs/contracts_policies_jokes.csv}
    redis-key: ${HEADER_CONTENT_REDIS_KEY:policymind:header-content}
  network:
    defaults:
      connect-timeout: 2s
      read-timeout: 10s
      call-timeout: 12s
      retry-max-attempts: 3
      retry-wait-duration: 300ms
      circuit-breaker-failure-rate-threshold: 50
      circuit-breaker-sliding-window-size: 10
      circuit-breaker-minimum-number-of-calls: 5
      circuit-breaker-wait-duration-in-open-state: 30s
      circuit-breaker-permitted-calls-in-half-open-state: 3
      max-concurrent-calls: 8
      max-wait-duration: 250ms
    services:
      openai-chat:
        read-timeout: 20s
        call-timeout: 25s
        max-concurrent-calls: 6
      openai-embedding:
        read-timeout: 20s
        call-timeout: 25s
        max-concurrent-calls: 12
      vertex-chat:
        read-timeout: 20s
        call-timeout: 25s
        max-concurrent-calls: 6
      vertex-embedding:
        read-timeout: 20s
        call-timeout: 25s
        max-concurrent-calls: 12
      recaptcha:
        connect-timeout: 1s
        read-timeout: 3s
        call-timeout: 4s
        retry-max-attempts: 2
        retry-wait-duration: 200ms
        circuit-breaker-sliding-window-size: 8
        circuit-breaker-minimum-number-of-calls: 4
        max-concurrent-calls: 20
        max-wait-duration: 100ms

jwt:
  secret: ${JWT_SECRET}
